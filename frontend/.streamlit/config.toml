# Theme pinned to light — the app's custom CSS is light-only.
# (The built-in Light/Dark picker is hidden when [theme] is set.)
[theme]
base = "light"

[server]
maxUploadSize = 10
enableXsrfProtection = false
enableCORS = false
headless = true

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = true
toolbarMode = "auto"
